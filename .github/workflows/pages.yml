name: Publish Table Football
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check game
        run: |
          node --check physics.js
          node --check ai.js
          node --check game.js
          node --test tests/*.test.cjs
          for file in beta/*.js; do node --check "$file"; done
          node --test beta/tests/*.test.cjs
      - name: Prepare website
        run: |
          mkdir _site
          cp index.html style.css physics.js ai.js game.js .nojekyll _site/
          cp -R assets _site/assets
          mkdir -p _site/beta
          cp beta/index.html beta/*.css beta/*.js _site/beta/
          cp -R beta/assets _site/beta/assets
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
